# Paste into the PowerSync dashboard → Sync Streams, then Validate and Deploy.
# Each user receives only their own rows; the server still enforces ownership with RLS on every upload.
config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM accounts WHERE user_id = auth.user_id()
      - SELECT * FROM categories WHERE user_id = auth.user_id()
      - SELECT * FROM transactions WHERE user_id = auth.user_id()
      - SELECT * FROM profiles WHERE user_id = auth.user_id()
      - SELECT * FROM debts WHERE user_id = auth.user_id()
